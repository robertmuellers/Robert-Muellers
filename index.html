<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robert Müllers</title>

    <!-- Google Fonts Imports -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">

    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="robertportfolio.css">
</head>
<body>

    <!-- Header & Nav -->
    <h1>Robert Portfolio</h1>
    <nav class="navbar">
        <ul>
            <li><a href="#about">about</a></li>
            <li><a href="#contact">contact</a></li>
        </ul>
    </nav>

    <!-- Artwork Containers -->
    <main>
        <div class="Hirtenbild">
            <figure>
                <img src="Der Hirte 140x210 cm.jpeg" alt="Der Hirte">
                <figcaption>
                    <div class="cap-title">Der Hirte</div>
                    <div class="cap-details">140x210 cm</div>
                </figcaption>
            </figure>
        </div>

        <div class="Huhn-Container">
            <figure>
                <img src="IMG_0001.JPG" alt="Artwork 1">
                
            </figure>
        </div>

        <div class="project-item">
            <figure>
                <img src="IMG_0003.JPG" alt="Artwork 2">
                <figcaption>
                    <div class="cap-title">Titel des Bildes</div>
                    <div class="cap-details">Oil on Canvas / 2026</div>
                </figcaption>
            </figure>
        </div>

        <div class="within">
            <figure>
                <img src="withinwithoutyou.jpg" alt="Within Without You">
                <figcaption>
                    <div class="cap-title">Within Without You</div>
                    <div class="cap-details">Details / Format</div>
                </figcaption>
            </figure>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Robert Muellers</p>
    </footer>

    <a href="#" class="back-to-top">↑</a>
