<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robert Müllers</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- EB Garamond Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FAFAFA;
      --text-color: #54411E;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'EB Garamond', Garamond, 'Times New Roman', serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Active selection italic style */
    .is-active {
      font-style: italic !important;
    }

    /* Artwork description styling (Reduced 1/3, non-italic) */
    .description-text {
      font-size: 0.6rem;
      line-height: 1.25;
      font-style: normal !important;
      font-weight: 400;
      color: var(--text-color);
      transition: transform 0.2s ease-out;
    }

    /* Reduced line height & letter spacing for About/Contact text */
    .reduced-line-height {
      line-height: 1.15 !important;
      letter-spacing: -0.01em;
      font-size: 0.75rem;
    }

    .fade-in {
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body class="min-h-screen bg-[#FAFAFA] text-[#54411E] selection:bg-[#54411E] selection:text-[#FAFAFA]">

  <!-- DESKTOP SPLIT SCREEN LAYOUT (md and up) -->
  <div class="hidden md:flex w-full min-h-screen flex-row">
    
    <!-- DESKTOP LEFT COLUMN (50% Width) -->
    <div class="w-1/2 p-3 md:p-5 flex flex-col justify-between shrink-0 min-h-screen">
      <div>
        <!-- Brand Header & Nav -->
        <header class="mb-10">
          <h1 class="text-xs md:text-sm font-normal leading-none mb-1.5 cursor-pointer" onclick="selectItem('hirte')">
            Robert Müllers
          </h1>
          <nav class="flex gap-4 text-[0.7rem] md:text-[0.75rem] font-normal">
            <span id="nav-about-desktop" class="cursor-pointer hover:opacity-75 transition-opacity" onclick="selectItem('about')">about</span>
            <span id="nav-contact-desktop" class="cursor-pointer hover:opacity-75 transition-opacity" onclick="selectItem('contact')">contact</span>
          </nav>
        </header>

        <!-- Works List & Dynamic Description Column -->
        <div class="relative items-start">
          <!-- Works List Container: Indented dynamically to align with 'contact' link -->
          <div id="works-list-desktop" class="flex flex-col gap-1 text-[0.7rem] md:text-[0.75rem] font-normal">
            <div id="work-hirte-desktop" class="cursor-pointer hover:opacity-75 transition-opacity w-fit" onclick="selectItem('hirte')">
              Der Hirte
            </div>
            <div id="work-within-desktop" class="cursor-pointer hover:opacity-75 transition-opacity w-fit" onclick="selectItem('within')">
              Within/without you
            </div>
            <div id="work-robert-desktop" class="cursor-pointer hover:opacity-75 transition-opacity w-fit" onclick="selectItem('robert')">
              Robert und das Huhn
            </div>
          </div>

          <!-- Dynamic Artwork Description Column -->
          <div class="absolute top-0 left-[180px] min-h-[50px] w-[180px]">
            <div id="artwork-description-desktop" class="description-text absolute top-0 left-0 pt-[0.05rem]"></div>
          </div>
        </div>
      </div>

      <!-- Desktop Footer -->
      <footer class="text-[0.55rem] opacity-60 mt-auto pt-6">
        &copy; 2026 Robert Müllers
      </footer>
    </div>

    <!-- DESKTOP RIGHT COLUMN (50% Width) -->
    <div id="right-column-desktop" class="w-1/2 min-h-screen relative bg-[#FAFAFA] flex items-start justify-start">
      <!-- Dynamic content rendered via JS -->
    </div>

  </div>


  <!-- MOBILE STACKED LAYOUT (below md) -->
  <div class="flex md:hidden flex-col w-full min-h-screen p-3 justify-between">
    <div>
      
      <!-- 1. Header & Nav Block -->
      <header class="mb-4">
        <h1 class="text-xs font-normal leading-none mb-1.5 cursor-pointer" onclick="selectItem('hirte')">
          Robert Müllers
        </h1>
        <nav class="flex gap-4 text-[0.7rem] font-normal">
          <span id="nav-about-mobile" class="cursor-pointer hover:opacity-75 transition-opacity" onclick="selectItem('about')">about</span>
          <span id="nav-contact-mobile" class="cursor-pointer hover:opacity-75 transition-opacity" onclick="selectItem('contact')">contact</span>
        </nav>
      </header>

      <!-- 2. Image Container (or About/Contact Text Container) -->
      <div id="mobile-media-container" class="w-full min-h-[350px] mb-4 bg-[#FAFAFA] flex items-start justify-start">
        <!-- Image or Page Content inserted via JS -->
      </div>

      <!-- 3. Image Description + Works Titles -->
      <div id="mobile-details-container" class="flex flex-col gap-3">
        <!-- Active Image Description -->
        <div id="artwork-description-mobile" class="description-text text-[0.65rem]"></div>

        <!-- Works Titles Block (Aligned with 'contact' link) -->
        <div id="works-list-mobile" class="flex flex-col gap-1 text-[0.7rem] font-normal pt-1">
          <div id="work-hirte-mobile" class="cursor-pointer hover:opacity-75 transition-opacity w-fit" onclick="selectItem('hirte')">
            Der Hirte
          </div>
          <div id="work-within-mobile" class="cursor-pointer hover:opacity-75 transition-opacity w-fit" onclick="selectItem('within')">
            Within/without you
          </div>
          <div id="work-robert-mobile" class="cursor-pointer hover:opacity-75 transition-opacity w-fit" onclick="selectItem('robert')">
            Robert und das Huhn
          </div>
        </div>
      </div>

    </div>

    <!-- 4. Mobile Copyright Footer -->
    <footer class="text-[0.55rem] opacity-60 pt-6 mt-6">
      &copy; 2026 Robert Müllers
    </footer>
  </div>


  <!-- Application Logic -->
  <script>
    const portfolioData = {
      'hirte': {
        type: 'artwork',
        title: 'Der Hirte',
        medium: 'Oil paint, wax pens on canvas,',
        year: '2026',
        imgSrc: 'Der Hirte_rand_final.png'
      },
      'within': {
        type: 'artwork',
        title: 'Within/without you',
        medium: 'Oil paint, oil crayons on canvas,',
        year: '2026',
        imgSrc: 'withinwithoutyou_cropped.png'
      },
      'robert': {
        type: 'artwork',
        title: 'Robert und das Huhn',
        medium: 'Oil on canvas,',
        year: '2026',
        imgSrc: 'IMG_0003.JPG'
      },
      'about': {
        type: 'page',
        title: 'About',
        content: `
          <div class="px-3 md:px-5 w-full flex flex-col justify-start items-start pt-3 md:pt-[var(--hirte-top,80px)]">
            <div class="max-w-md reduced-line-height space-y-3 fade-in">
              <p>
                Robert Müllers is a contemporary painter, based in Düsseldorf specializing in colourful, large-scale oil works.
              </p>
              <p>
                (b. 1992) His work examines figurative abstraction, gesture, and physical texture. Müllers' paintings inhabit a space between quiet states and vivid expressionism, drawing upon raw brushwork juxtaposed with distinct linework.
              </p>
              <div class="pt-2 space-y-0.5">
                <p class="font-normal">Selected Exhibitions:</p>
                <p>2026 — Group Exhibition, Berlin</p>
                <p>2025 — Solo Presentation, Kunsthalle Studio</p>
              </div>
            </div>
          </div>
        `
      },
      'contact': {
        type: 'page',
        title: 'Contact',
        content: `
          <div class="px-3 md:px-5 w-full flex flex-col justify-start items-start pt-3 md:pt-[var(--hirte-top,80px)]">
            <div class="max-w-md reduced-line-height space-y-2 fade-in">
              <p class="font-normal">
                <a href="mailto:Robert@stippmilch.de" class="hover:underline">Robert(at)stippmilch.de</a>
              </p>
              <p class="font-normal">
                <a href="https://instagram.com/Robert.muellers" target="_blank" rel="noopener noreferrer" class="hover:underline">@Robert.muellers</a>
              </p>
            </div>
          </div>
        `
      }
    };

    function alignIndentationAndBaseline() {
      // 1. Align Indentation of Works List with the start of 'contact' button
      const contactElDesktop = document.getElementById('nav-contact-desktop');
      const worksListDesktop = document.getElementById('works-list-desktop');
      const contactElMobile = document.getElementById('nav-contact-mobile');
      const worksListMobile = document.getElementById('works-list-mobile');

      if (contactElDesktop && worksListDesktop) {
        const contactLeft = contactElDesktop.offsetLeft;
        worksListDesktop.style.paddingLeft = `${contactLeft}px`;
      }
      if (contactElMobile && worksListMobile) {
        const contactLeftMobile = contactElMobile.offsetLeft;
        worksListMobile.style.paddingLeft = `${contactLeftMobile}px`;
      }

      // 2. Measure top position of 'Der Hirte' on desktop to align About/Contact pages
      const hirteEl = document.getElementById('work-hirte-desktop');
      if (hirteEl) {
        const rect = hirteEl.getBoundingClientRect();
        document.documentElement.style.setProperty('--hirte-top', `${rect.top}px`);
      }
    }

    function selectItem(key) {
      if (!portfolioData[key]) return;

      alignIndentationAndBaseline();

      // Clear all active states
      ['nav-about-desktop', 'nav-contact-desktop', 'nav-about-mobile', 'nav-contact-mobile'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.remove('is-active');
      });

      ['hirte', 'within', 'robert'].forEach(k => {
        const deskEl = document.getElementById(`work-${k}-desktop`);
        const mobEl = document.getElementById(`work-${k}-mobile`);
        if (deskEl) deskEl.classList.remove('is-active');
        if (mobEl) mobEl.classList.remove('is-active');
      });

      const data = portfolioData[key];
      const descElDesktop = document.getElementById('artwork-description-desktop');
      const descElMobile = document.getElementById('artwork-description-mobile');
      const rightColDesktop = document.getElementById('right-column-desktop');
      const mobileMediaContainer = document.getElementById('mobile-media-container');

      if (data.type === 'artwork') {
        // Activate item titles
        const activeDeskTitle = document.getElementById(`work-${key}-desktop`);
        const activeMobTitle = document.getElementById(`work-${key}-mobile`);
        if (activeDeskTitle) activeDeskTitle.classList.add('is-active');
        if (activeMobTitle) activeMobTitle.classList.add('is-active');

        // Align Desktop Description Y position with selected artwork
        if (activeDeskTitle) {
          const containerRect = document.getElementById('works-list-desktop').getBoundingClientRect();
          const itemRect = activeDeskTitle.getBoundingClientRect();
          const topOffset = itemRect.top - containerRect.top;
          descElDesktop.style.transform = `translateY(${topOffset}px)`;
        }

        // Render Description
        const descHTML = `<div class="fade-in"><div>${data.medium}</div><div>${data.year}</div></div>`;
        descElDesktop.innerHTML = descHTML;
        descElMobile.innerHTML = descHTML;

        // Render Artwork Image on Desktop & Mobile
        const imageHTML = `
          <div class="w-full h-full flex items-start justify-start fade-in">
            <img src="${data.imgSrc}" alt="${data.title}" class="w-full h-auto max-h-screen object-contain object-top" onerror="this.onerror=null; this.src='https://placehold.co/600x750/FAFAFA/54411E?text=${encodeURIComponent(data.title)}';">
          </div>
        `;
        rightColDesktop.innerHTML = imageHTML;
        mobileMediaContainer.innerHTML = imageHTML;

      } else if (data.type === 'page') {
        // Activate Nav button
        const activeNavDesktop = document.getElementById(`nav-${key}-desktop`);
        const activeNavMobile = document.getElementById(`nav-${key}-mobile`);
        if (activeNavDesktop) activeNavDesktop.classList.add('is-active');
        if (activeNavMobile) activeNavMobile.classList.add('is-active');

        // Clear artwork descriptions
        descElDesktop.innerHTML = '';
        descElMobile.innerHTML = '';

        // Render Page Content on Desktop & Mobile
        rightColDesktop.innerHTML = data.content;
        mobileMediaContainer.innerHTML = data.content;
      }
    }

    // Initialize layout setup and resize handling
    window.addEventListener('DOMContentLoaded', () => {
      alignIndentationAndBaseline();
      selectItem('hirte');
    });

    window.addEventListener('resize', () => {
      alignIndentationAndBaseline();
      const activeArtwork = ['hirte', 'within', 'robert'].find(k => {
        const el = document.getElementById(`work-${k}-desktop`);
        return el && el.classList.contains('is-active');
      });
      if (activeArtwork) {
        selectItem(activeArtwork);
      } else {
        const activeNav = ['about', 'contact'].find(k => {
          const el = document.getElementById(`nav-${k}-desktop`);
          return el && el.classList.contains('is-active');
        });
        if (activeNav) selectItem(activeNav);
      }
    });
  </script>
</body>
</html>
