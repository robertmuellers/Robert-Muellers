<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robert Müllers</title>

    <!-- Google Fonts Imports -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">

    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="robertportfolio.css">
    <meta name="description" content="Robert Müllers is a contemporary painter, based in Düsseldorf specializing in colourful, large-scale oil works.">
    <meta name="google-site-verification" content="kvtQ2MvNfnJ0jJ8ZuXRaov49cpadRkQCn6q10G521EY" />
</head>
<body id="top">

    <!-- Header & Nav -->
    <header>
        <h1>Robert Müllers</h1>
        <nav class="navbar">
            <ul>
                <li><a href="javascript:void(0)" id="about-link">about</a></li>
                <li><a href="javascript:void(0)" id="contact-link">contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Ausklappbarer About-Bereich -->
    <div id="about-section" class="about-collapse">
        <div class="about-content">
            <p>Robert Müllers is a contemporary painter, based in Düsseldorf specializing in colourful, large-scale oil works.</p>
        </div>
    </div>

    <!-- Ausklappbarer Contact-Bereich -->
    <div id="contact-section" class="about-collapse">
        <div class="about-content">
            <p>Robert(at)stippmilch.de<br>@Robert.muellers</p>
        </div>
    </div>

    <!-- Artwork Containers -->
    <main>
        <div class="Hirtenbild">
            <figure>
                <img src="Der Hirte_rand_final.png" alt="Der Hirte">
                <figcaption>
                    <div class="cap-title">Der Hirte</div>
                    <div class="cap-details">Oil paint, wax pens on canvas / 2026<div>
                </figcaption>
            </figure>
        </div>

        <!-- Prozess-Shot & Robert und das Huhn nah beieinander -->
        <div class="Huhn-Container">
            <figure>
                <img src="IMG_0001.JPG" alt="Process shot of painting">
            </figure>
            <figure>
                <img src="IMG_0003.JPG" alt="Robert und das Huhn">
                <figcaption>
                    <div class="cap-title">Robert und das Huhn</div>
                    <div class="cap-details">Oil on canvas / 2026</div>
                </figcaption>
            </figure>
        </div>

        <div class="within">
            <figure>
                <img src="withinwithoutyou_cropped.png" alt="Within Without You">
                <figcaption>
                         </figure>
             <img src="within_withoutyoucloseup.png" alt="Within Without You">
                  <figure>
                    <div class="cap-title">Within Without You</div>
                    <div class="cap-details">Oil paint, oil crayons on canvas / 2026</div>
                </figcaption>
            </figure>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Robert Müllers</p>
    </footer>

    <!-- Back to Top Link -->
    <a href="#top" class="back-to-top">back to top</a>

    <!-- JavaScript für das Ausklappen von "about" und "contact" -->
    <script>
        const aboutLink = document.getElementById('about-link');
        const aboutSection = document.getElementById('about-section');
        const contactLink = document.getElementById('contact-link');
        const contactSection = document.getElementById('contact-section');

        aboutLink.addEventListener('click', (e) => {
            e.preventDefault();
            contactSection.classList.remove('show'); // Schließt contact, falls offen
            aboutSection.classList.toggle('show');
        });

        contactLink.addEventListener('click', (e) => {
            e.preventDefault();
            aboutSection.classList.remove('show'); // Schließt about, falls offen
            contactSection.classList.toggle('show');
        });

        const backToTop = document.querySelector('.back-to-top');

        window.addEventListener('scroll', () => {
            if (window.pageYOffset > 400) {
                backToTop.style.opacity = "1";
                backToTop.style.pointerEvents = "auto";
            } else {
                backToTop.style.opacity = "0";
                backToTop.style.pointerEvents = "none";
            }
        });
    </script>

</body>
</html>
