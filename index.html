<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robert Müllers</title>
  
  <!-- Preload Initial Artwork Image for Instant Mobile Loading -->
  <link rel="preload" as="image" href="Der Hirte_rand_final.png" fetchpriority="high">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'EB Garamond', serif;
      background-color: #FAFAFA;
      color: #54411E;
    }
    .selected-italic {
      font-style: italic;
    }
    @media (min-width: 768px) {
      #mobile-works-section {
        display: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen bg-[#FAFAFA] text-[#54411E] overflow-x-hidden selection:bg-[#54411E] selection:text-[#FAFAFA]">

  <div class="w-full min-h-screen flex flex-col md:flex-row">
    
    <!-- LEFT COLUMN -->
    <div class="w-full md:w-1/2 p-3 md:p-5 flex flex-col justify-between z-10 order-1">
      
      <!-- Header & Navigation -->
      <div>
        <h1 class="text-xs md:text-sm font-normal leading-tight tracking-normal mb-0.5 cursor-default">
          Robert Müllers
        </h1>
        
        <nav class="flex gap-3 text-[0.7rem] md:text-[0.75rem] font-normal leading-tight mb-4 md:mb-12">
          <button id="nav-about" onclick="selectSection('about')" class="hover:opacity-80 transition-opacity">
            about
          </button>
          <button id="nav-contact" onclick="selectSection('contact')" class="hover:opacity-80 transition-opacity">
            contact
          </button>
        </nav>

        <!-- DESKTOP WORKS LIST & ALIGNED DESCRIPTION -->
        <div id="works-container-desktop" class="hidden md:block relative">
          <div id="works-list-desktop" class="flex flex-col space-y-0.5 text-[0.75rem] font-normal leading-snug">
            <button id="work-hirte-dt" onclick="selectWork('hirte')" class="text-left hover:opacity-80 transition-all w-fit">
              Der Hirte
            </button>
            <button id="work-within-dt" onclick="selectWork('within')" class="text-left hover:opacity-80 transition-all w-fit">
              Within/without you
            </button>
            <button id="work-robert-dt" onclick="selectWork('robert')" class="text-left hover:opacity-80 transition-all w-fit">
              Robert und das Huhn
            </button>
          </div>

          <!-- FIXED ALIGNED DESKTOP DESCRIPTION COLUMN -->
          <div id="desc-container-desktop" class="absolute top-0 left-[185px] transition-transform duration-200 ease-out text-[0.55rem] leading-tight font-normal not-italic w-[160px]">
            <span id="desc-text-desktop"></span>
          </div>
        </div>

      </div>

    </div>

    <!-- RIGHT HALF (IMAGE / CONTENT) -->
    <div class="w-full md:w-1/2 min-h-[40vh] md:min-h-screen relative bg-[#FAFAFA] flex items-start justify-start p-3 pt-0 md:p-0 order-2 md:order-2">
      
      <!-- Artwork Container -->
      <div id="art-container" class="w-full h-full flex items-start justify-start transition-opacity duration-300">
        <img 
          id="art-image" 
          src="Der Hirte_rand_final.png" 
          alt="Artwork" 
          decoding="async" 
          fetchpriority="high"
          class="w-full h-auto max-h-screen object-contain object-top transition-opacity duration-200"
        >
      </div>

      <!-- About Section Content -->
      <div id="about-container" class="hidden absolute top-0 left-0 w-full p-3 pt-0 md:p-5 transition-all duration-200">
        <div class="max-w-md text-[0.7rem] md:text-[0.75rem] tracking-tight font-normal" style="line-height: 1.15; letter-spacing: -0.01em;">
          <p class="mb-3">
            Robert Müllers is a contemporary painter, based in Düsseldorf specializing in colourful, large-scale oil works.
          </p>
  
    
        </div>
      </div>

      <!-- Contact Section Content -->
      <div id="contact-container" class="hidden absolute top-0 left-0 w-full p-3 pt-0 md:p-5 transition-all duration-200">
        <div class="max-w-md text-[0.7rem] md:text-[0.75rem] tracking-tight font-normal" style="line-height: 1.15; letter-spacing: -0.01em;">
          <p class="mb-1.5">
            <a href="mailto:Robert@stippmilch.de" class="hover:underline">Robert(at)stippmilch.de</a>
          </p>
          <p class="mb-3">
            <a href="https://instagram.com/Robert.muellers" target="_blank" rel="noopener noreferrer" class="hover:underline">@Robert.muellers</a>
          </p>
        </div>
      </div>

    </div>

    <!-- MOBILE WORKS LIST -->
    <div id="mobile-works-section" class="block md:hidden order-3 p-3 pt-2 pb-2">
      <div id="works-container-mobile" class="relative">
        <div id="works-list-mobile" class="flex flex-col space-y-0.5 text-[0.7rem] font-normal leading-snug">
          <button id="work-hirte-mb" onclick="selectWork('hirte')" class="text-left hover:opacity-80 transition-all w-fit">
            Der Hirte
          </button>
          <button id="work-within-mb" onclick="selectWork('within')" class="text-left hover:opacity-80 transition-all w-fit">
            Within/without you
          </button>
          <button id="work-robert-mb" onclick="selectWork('robert')" class="text-left hover:opacity-80 transition-all w-fit">
            Robert und das Huhn
          </button>
        </div>

        <div id="desc-container-mobile" class="absolute top-0 left-[165px] transition-transform duration-200 ease-out text-[0.55rem] leading-tight font-normal not-italic w-[130px]">
          <span id="desc-text-mobile"></span>
        </div>
      </div>
    </div>

    <!-- Copyright Footer -->
    <div class="w-full p-3 md:p-5 order-4 md:absolute md:bottom-0 md:left-0 md:w-1/2 pointer-events-none z-20">
      <footer class="text-[0.55rem] opacity-60 pointer-events-auto">
        &copy; 2026 Robert Müllers
      </footer>
    </div>

  </div>

  <script>
    const works = [
      {
        id: "hirte",
        title: "Der Hirte",
        desc: "Oil paint, wax pens on canvas,<br>2026",
        img: "Der Hirte_rand_final.png"
      },
      {
        id: "within",
        title: "Within/without you",
        desc: "Oil paint, oil crayons on canvas,<br>2026",
        img: "withinwithoutyou_cropped.png"
      },
      {
        id: "robert",
        title: "Robert und das Huhn",
        desc: "Oil on canvas,<br>2026",
        img: "IMG_0003.JPG"
      }
    ];

    let currentSelection = 'hirte';

    function prefetchImages() {
      works.forEach(work => {
        const img = new Image();
        img.src = work.img;
      });
    }

    function alignContent() {
      const contactBtn = document.getElementById('nav-contact');
      const worksDesktop = document.getElementById('works-container-desktop');
      const worksMobile = document.getElementById('works-container-mobile');
      
      const hirteDt = document.getElementById('work-hirte-dt');
      const hirteMb = document.getElementById('work-hirte-mb');
      
      const descDesktop = document.getElementById('desc-container-desktop');
      const descMobile = document.getElementById('desc-container-mobile');
      
      const aboutContainer = document.getElementById('about-container');
      const contactContainer = document.getElementById('contact-container');

      // Indent works list dynamically to align with "contact" button
      if (contactBtn) {
        const contactRect = contactBtn.getBoundingClientRect();
        const bodyRect = document.body.getBoundingClientRect();
        const indentLeft = contactRect.left - bodyRect.left;
        if (indentLeft > 0) {
          if (worksDesktop) worksDesktop.style.paddingLeft = `${indentLeft - 12}px`;
          if (worksMobile) worksMobile.style.paddingLeft = `${indentLeft - 12}px`;
        }
      }

      // Vertical offset alignment for active work item
      const selectedIndex = works.findIndex(w => w.id === currentSelection);
      if (selectedIndex !== -1) {
        if (window.innerWidth >= 768 && descDesktop && hirteDt) {
          const dtBtn = document.getElementById(`work-${currentSelection}-dt`);
          if (dtBtn) {
            const offset = dtBtn.offsetTop - hirteDt.offsetTop;
            descDesktop.style.transform = `translateY(${offset}px)`;
          }
        } else if (descMobile && hirteMb) {
          const mbBtn = document.getElementById(`work-${currentSelection}-mb`);
          if (mbBtn) {
            const offset = mbBtn.offsetTop - hirteMb.offsetTop;
            descMobile.style.transform = `translateY(${offset}px)`;
          }
        }
      }

      if (window.innerWidth < 768) return;

      // Align About / Contact top padding on Desktop
      if (hirteDt) {
        const hirteRect = hirteDt.getBoundingClientRect();
        if (aboutContainer) aboutContainer.style.paddingTop = `${hirteRect.top}px`;
        if (contactContainer) contactContainer.style.paddingTop = `${hirteRect.top}px`;
      }
    }

    function selectWork(id) {
      currentSelection = id;
      const work = works.find(w => w.id === id);
      if (!work) return;

      clearSelections();
      
      const targetDt = document.getElementById(`work-${id}-dt`);
      const targetMb = document.getElementById(`work-${id}-mb`);
      if (targetDt) targetDt.classList.add('selected-italic');
      if (targetMb) targetMb.classList.add('selected-italic');

      // Update text in active viewport description container
      const isDesktop = window.innerWidth >= 768;
      const descDtText = document.getElementById('desc-text-desktop');
      const descMbText = document.getElementById('desc-text-mobile');

      if (isDesktop) {
        if (descDtText) descDtText.innerHTML = work.desc;
        if (descMbText) descMbText.innerHTML = '';
      } else {
        if (descMbText) descMbText.innerHTML = work.desc;
        if (descDtText) descDtText.innerHTML = '';
      }

      // Show Mobile Works Block on mobile
      const mobileWorksSec = document.getElementById('mobile-works-section');
      if (mobileWorksSec && !isDesktop) {
        mobileWorksSec.style.display = 'block';
      }

      // Display Image with Case Fallback Support
      const artContainer = document.getElementById('art-container');
      const artImage = document.getElementById('art-image');
      
      artImage.onerror = function() {
        if (this.src.endsWith('.png')) {
          this.src = work.img.replace('.png', '.PNG');
        } else if (this.src.endsWith('.PNG')) {
          this.src = work.img.toLowerCase();
        }
      };
      
      if (artImage.src !== work.img) {
        artImage.src = work.img;
      }
      artImage.alt = work.title;
      artContainer.classList.remove('hidden');

      // Hide Text Views
      document.getElementById('about-container').classList.add('hidden');
      document.getElementById('contact-container').classList.add('hidden');

      alignContent();
    }

    function selectSection(type) {
      currentSelection = type;
      clearSelections();

      const navBtn = document.getElementById(`nav-${type}`);
      if (navBtn) navBtn.classList.add('selected-italic');

      // Hide Image & Description
      document.getElementById('art-container').classList.add('hidden');
      const descDtText = document.getElementById('desc-text-desktop');
      const descMbText = document.getElementById('desc-text-mobile');
      if (descDtText) descDtText.innerHTML = '';
      if (descMbText) descMbText.innerHTML = '';

      // Hide Mobile Works Block when in About/Contact views
      const mobileWorksSec = document.getElementById('mobile-works-section');
      if (mobileWorksSec) mobileWorksSec.style.display = 'none';

      // Show Selected View
      const aboutContainer = document.getElementById('about-container');
      const contactContainer = document.getElementById('contact-container');

      if (type === 'about') {
        aboutContainer.classList.remove('hidden');
        contactContainer.classList.add('hidden');
      } else if (type === 'contact') {
        contactContainer.classList.remove('hidden');
        aboutContainer.classList.add('hidden');
      }

      alignContent();
    }

    function clearSelections() {
      ['about', 'contact'].forEach(id => {
        const el = document.getElementById(`nav-${id}`);
        if (el) el.classList.remove('selected-italic');
      });
      works.forEach(w => {
        const dt = document.getElementById(`work-${w.id}-dt`);
        const mb = document.getElementById(`work-${w.id}-mb`);
        if (dt) dt.classList.remove('selected-italic');
        if (mb) mb.classList.remove('selected-italic');
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      selectWork('hirte');
      alignContent();
      setTimeout(prefetchImages, 800);
    });
    window.addEventListener('resize', () => {
      alignContent();
      selectWork(currentSelection);
    });
  </script>
</body>
</html>
